name: flag-quiz

services:
  flag-quiz:
    container_name: flag-quiz
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: 3000
    networks:
      - external_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, bun, -e, "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The homelab Anubis router is the only public entrypoint. Never expose a
    # lower-priority backend router when Anubis stops or becomes unhealthy.
    labels:
      - traefik.enable=false

networks:
  external_network:
    external: true
    name: external_network
